name: CodeQL SAST

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: android-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Build Kotlin and Java bytecode for analysis
        run: ./gradlew --no-daemon assembleDebug
      - name: Analyze and upload SARIF
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          output: codeql-results
      - name: Enforce Medium-or-higher SAST policy
        run: python3 scripts/check-codeql-sarif.py codeql-results
      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-codeql-${{ github.sha }}
          path: codeql-results/
          if-no-files-found: error
          retention-days: 30
